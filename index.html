<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prasha & Abhinaba | Save The Date</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Montserrat:wght@200;300;400&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="assets/Golden_Morning_Light.mp3" type="audio/mpeg" />
  </audio>

  <main class="page-container">

    <header class="top-header">
      <button class="music-toggle-btn" id="musicToggle" aria-label="Toggle background music">
        <span class="music-icon" id="musicIcon">♫</span>
      </button>
      <span class="header-tag">SAVE THE DATE</span>
      <div class="header-spacer"></div>
    </header>

    <section class="card-section">
      <div class="art-frame">
        <img src="images/savethedate_without_venue.png" alt="Wedding Invitation" class="card-image" />
      </div>
      <p class="quote">"Two lives, one shared journey."</p>
    </section>

    <section class="timer-section">
      <p class="section-label">COUNTING DOWN THE DAYS</p>
      <div class="countdown-grid">
        <div class="time-box">
          <span class="time-val" id="days">00</span>
          <span class="time-lbl">DAYS</span>
        </div>
        <span class="time-sep">:</span>
        <div class="time-box">
          <span class="time-val" id="hours">00</span>
          <span class="time-lbl">HOURS</span>
        </div>
        <span class="time-sep">:</span>
        <div class="time-box">
          <span class="time-val" id="minutes">00</span>
          <span class="time-lbl">MINS</span>
        </div>
        <span class="time-sep">:</span>
        <div class="time-box">
          <span class="time-val" id="seconds">00</span>
          <span class="time-lbl">SECS</span>
        </div>
      </div>
    </section>

    <section class="venue-section">
      <div class="venue-card">
        <div class="corner-filigree top-left"></div>
        <div class="corner-filigree top-right"></div>
        <div class="corner-filigree bottom-left"></div>
        <div class="corner-filigree bottom-right"></div>

        <p class="section-label">THE DESTINATION</p>

        <div class="hall-frame">
          <img src="images/dayal_vatika_stylized_0.png" alt="Dayal Vatika" class="hall-image" />
        </div>

        <h2 class="venue-title">Dayal Vatika</h2>
        <p class="venue-location">Ratlam, Madhya Pradesh</p>
        <p class="event-dates">JANUARY 25 – 26, 2027</p>

        <a href="https://maps.app.goo.gl/bp5XgP6xSAW2FE6p9" target="_blank" rel="noopener noreferrer" class="map-button">
          VIEW LOCATION ON MAP
        </a>
      </div>
    </section>

    <footer class="footer">
      <p>Celebration details will follow shortly.</p>
      <span class="crest">❖</span>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
